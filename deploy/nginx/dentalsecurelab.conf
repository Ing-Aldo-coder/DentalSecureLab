# ==============================================================================
# DentalSecureLab - Configuración de Proxy Reverso Nginx con TLS / HSTS
# Arquitectura: Endpoints Clínicos -> Nginx (TLS/HSTS) -> Gunicorn (WSGI) -> Django
# ==============================================================================

# Redirección obligatoria de HTTP (puerto 80) a HTTPS (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name dentalsecurelab.clinica.local localhost 127.0.0.1;

    # Bloqueo de métodos no admitidos en canal inseguro y redirección permanente
    return 301 https://$host$request_uri;
}

# Servidor principal con terminación TLS segura y cabeceras de endurecimiento
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dentalsecurelab.clinica.local localhost 127.0.0.1;

    # Certificados digitales TLS (X.509)
    ssl_certificate /etc/ssl/certs/dentalsecurelab.crt;
    ssl_certificate_key /etc/ssl/private/dentalsecurelab.key;

    # Protocolos seguros y mitigación de suites criptográficas obsoletas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Parámetros Diffie-Hellman para Perfect Forward Secrecy (PFS)
    # ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Cabeceras estrictas de seguridad (HSTS y mitigación de inyección)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Control de tamaño máximo de carga (prevención de DoS por memoria)
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /var/www/dentalsecurelab/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Bloqueo directo a base de datos y archivos sensibles en el sistema de archivos
    location ~* /(db\.sqlite3|\.env|\.git|requirements\.txt) {
        deny all;
        return 404;
    }

    # Proxy reverso a la instancia WSGI Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts de proxy para operaciones clínicas concurrentes
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Registro de auditoría y accesos
    access_log /var/log/nginx/dentalsecurelab_access.log;
    error_log /var/log/nginx/dentalsecurelab_error.log warn;
}
