{% extends 'base.html' %}

{% block title %}
{{ title }} | DentalSecureLab
{% endblock %}

{% block content %}

<h2>{{ title }}</h2>

<form method="POST" class="form">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="form-actions">

        <button type="submit" class="btn">
            Guardar expediente
        </button>

        <a href="{% url 'record_list' %}"
           class="btn-secondary">
            Cancelar
        </a>

    </div>

</form>

{% endblock %}
